<title>BRFD Event Dashboards</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#15181d;--muted:#5b6470;--line:#dde1e7;--brand:#0c2a5a; --brand-d:#001028; --hl:#e8202e; --hl-soft:#fdecee; --head:#0c2a5a; --hot-ink:#001028;}
@media (prefers-color-scheme: dark){:root{--bg:#0f1216;--panel:#181c22;--ink:#eef1f5;--muted:#9aa4b2;--line:#2a313a;--brand:#17387a; --brand-d:#00081a; --hl:#ff3b4a; --hl-soft:#3a1318; --head:#9fb8ee; --hot-ink:#ff8a93;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
main{max-width:600px;width:100%;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--brand);border-radius:12px;padding:28px 24px;text-align:center}
.plate{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:16px}
.plate img{height:40px;width:auto;display:block}
h1{margin:0 0 8px;font-size:1.4rem}
p{margin:8px 0;color:var(--muted)}
.rule{height:4px;width:64px;background:var(--hl);border-radius:2px;margin:14px auto}
.ev{display:block;text-align:left;margin:10px 0;padding:14px 16px;border:1px solid var(--line);border-left:6px solid var(--hl);border-radius:10px;color:var(--ink);text-decoration:none}
.ev:hover{background:var(--hl-soft)}
.ev b{display:block;font-size:1.05rem}
.ev span{color:var(--muted);font-size:.9rem}
</style>
